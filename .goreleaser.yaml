# GoReleaser konfigurace pro Claude Hub daemon.
# Spustit lokálně přes `goreleaser release --snapshot --clean`
# nebo automaticky přes GitHub Actions tag push.

version: 2

project_name: claude-hub-daemon

before:
  hooks:
    - go mod tidy -modfile=apps/daemon/go.mod

builds:
  - id: claude-hub-daemon
    main: ./apps/daemon/cmd/claude-hub-daemon
    binary: claude-hub-daemon
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    builds: [claude-hub-daemon]
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  name_template: "{{ .Tag }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: animato-lab
    name: claude-hub
  draft: false
  prerelease: auto
  name_template: "Claude Hub Daemon v{{ .Version }}"

brews:
  - name: claude-hub-daemon
    repository:
      owner: animato-lab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://hub.animato-lab.cz"
    description: "Lokální služba pro Claude Hub — sdílení skillů, příkazů, MCP a hooků v týmu."
    license: MIT
    test: |
      system "#{bin}/claude-hub-daemon", "-host", "127.0.0.1", "-port", "0"
    install: |
      bin.install "claude-hub-daemon"
    service: |
      run [opt_bin/"claude-hub-daemon"]
      keep_alive true
      log_path var/"log/claude-hub-daemon.log"
      error_log_path var/"log/claude-hub-daemon.log"

scoops:
  - name: claude-hub-daemon
    repository:
      owner: animato-lab
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://hub.animato-lab.cz"
    description: "Lokální služba pro Claude Hub."
    license: MIT
