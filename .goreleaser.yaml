# GoReleaser konfigurace pro Claude Hub daemon.
# Spustit lokálně přes `goreleaser release --snapshot --clean`
# nebo automaticky přes GitHub Actions tag push.

version: 2

project_name: claude-hub-daemon

builds:
  - id: claude-hub-daemon
    main: ./cmd/claude-hub-daemon
    dir: apps/daemon
    binary: claude-hub-daemon
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    ids: [claude-hub-daemon]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Bez verze v názvu — díky tomu funguje stabilní URL
    # https://github.com/<owner>/<repo>/releases/latest/download/claude-hub-daemon_<os>_<arch>.<ext>
    # napříč releasy. Verze je uložená v binárce přes ldflag `main.version`.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  name_template: "Claude Hub Daemon v{{ .Version }}"
