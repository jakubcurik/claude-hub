services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_hub
      POSTGRES_USER: claude_hub
      POSTGRES_PASSWORD: claude_hub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude_hub -d claude_hub"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLAUDE_HUB_DATABASE_URL: postgres://claude_hub:claude_hub@postgres:5432/claude_hub
      CLAUDE_HUB_API_HOST: 0.0.0.0
      CLAUDE_HUB_API_PORT: 8787
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "8787:8787"

  daemon:
    build:
      context: .
      dockerfile: apps/daemon/Dockerfile
    environment:
      CLAUDE_HUB_WORKSPACE_ROOTS: /workspace-roots/d-claude
      CLAUDE_HUB_ALLOWED_WEB_ORIGINS: ${CLAUDE_HUB_ALLOWED_WEB_ORIGINS:-http://localhost:3100}
    command:
      - "-host"
      - "0.0.0.0"
      - "-port"
      - "17373"
      - "-claude-home"
      - "/data/claude"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:17373/v1/hello"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "17373:17373"
    volumes:
      - ${USERPROFILE}/.claude:/data/claude
      - ${CLAUDE_HUB_WORKSPACE_ROOT_D:-D:/Claude}:/workspace-roots/d-claude:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      daemon:
        condition: service_started
    environment:
      CLAUDE_HUB_API_URL: http://api:8787
      CLAUDE_HUB_DAEMON_BREW_PACKAGE: ${CLAUDE_HUB_DAEMON_BREW_PACKAGE:-animato-lab/tap/claude-hub-daemon}
      CLAUDE_HUB_DAEMON_WINGET_ID: ${CLAUDE_HUB_DAEMON_WINGET_ID:-Animato.ClaudeHubDaemon}
      CLAUDE_HUB_PUBLIC_URL: ${CLAUDE_HUB_PUBLIC_URL:-https://hub.animato-lab.cz}
      NODE_ENV: production
    ports:
      - "3100:3000"

volumes:
  postgres-data:
