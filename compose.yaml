services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_hub
      POSTGRES_USER: claude_hub
      POSTGRES_PASSWORD: claude_hub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude_hub -d claude_hub"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      # Host port 15432, aby nekolidoval se systémovým Postgresem na NASu (Synology
      # používá 5432 pro vestavěné DB). Pro lokální dev přepiš v compose.override.yaml.
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLAUDE_HUB_DATABASE_URL: postgres://claude_hub:claude_hub@postgres:5432/claude_hub
      CLAUDE_HUB_API_HOST: 0.0.0.0
      CLAUDE_HUB_API_PORT: 8787
      CLAUDE_HUB_TEAM_ID: ${CLAUDE_HUB_TEAM_ID:-main}
      CLAUDE_HUB_TEAM_NAME: ${CLAUDE_HUB_TEAM_NAME:-Tým}
      # Allowlist e-mailů / domén, které se smí zaregistrovat. Položka může
      # být buď konkrétní e-mail (`jmeno@example.com`), nebo doména
      # (`animato.cz` → projde každý `*@animato.cz`). Více oddělené čárkou.
      # Prázdné = registrace zakázaná (503). Pro veřejně dostupný hub
      # POVINNÉ nastavit.
      CLAUDE_HUB_ALLOWED_EMAILS: ${CLAUDE_HUB_ALLOWED_EMAILS:-}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "127.0.0.1:8787:8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side fetch z Next.js (login, hub-auth, ...) sahá rovnou na
      # interní Docker DNS, žádná veřejná URL nepotřebuje.
      CLAUDE_HUB_API_URL: http://api:8787
      # URL, kterou daemon na uživatelově počítači použije pro forwarding
      # OTLP telemetrie. Musí být veřejně dostupná — Next.js rewrite v
      # next.config.mjs proxuje `/api/...` na interní `api:8787`, takže
      # stačí stejná doména jako hub web. Pro jiný deploy přepiš v .env.
      CLAUDE_HUB_PUBLIC_API_URL: ${CLAUDE_HUB_PUBLIC_API_URL:-https://hub.animato-lab.cz/api}
      CLAUDE_HUB_PUBLIC_URL: ${CLAUDE_HUB_PUBLIC_URL:-https://hub.animato-lab.cz}
      CLAUDE_HUB_TEAM_ID: ${CLAUDE_HUB_TEAM_ID:-main}
      CLAUDE_HUB_TEAM_NAME: ${CLAUDE_HUB_TEAM_NAME:-Tým}
      NODE_ENV: production
    ports:
      # Localhost-only — produkční přístup řeší reverse proxy (např. nginx terminuje TLS
      # na hub.animato-lab.cz a forwarduje na 127.0.0.1:3000).
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
